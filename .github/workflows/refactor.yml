name: Issue-driven refactor (CodeBuddy)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: refactor-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Gate 1: ask a human to approve the new issue
  request-approval:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Ask human for approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" --body "CodeBuddy pipeline triggered by this issue. Human-in-the-loop approval required: reply with /approve on this issue to proceed."

  # After /approve: let CodeBuddy CLI do the AI refactor, then open a PR (gate 2: human merges)
  codebuddy-refactor:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.type == 'User' &&
      startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CodeBuddy CLI
        run: npm install -g @tencent-ai/codebuddy-code

      # Credentials injected from GitHub secret, never stored in the repo
      - name: Restore CodeBuddy credentials
        env:
          CODEBUDDY_AUTH: ${{ secrets.CODEBUDDY_AUTH }}
        run: |
          mkdir -p "$HOME/.codebuddy"
          echo "$CODEBUDDY_AUTH" | base64 -d | tar xzf - -C "$HOME"
          chmod 700 "$HOME/.codebuddy"

      - name: Run CodeBuddy refactor (headless)
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          ISSUE_TITLE=$(gh issue view "$NUMBER" --json title -q .title)
          ISSUE_BODY=$(gh issue view "$NUMBER" --json body -q .body)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "refactor/issue-$NUMBER"
          codebuddy -p --max-turns 10 \
            --permission-mode auto \
            --no-session-persistence \
            "You are running headless in CI, in the repository working directory.
          Implement the following GitHub issue. Keep the change minimal.
          Only modify files - do NOT run git commit or git push.
          Issue #$NUMBER: $ISSUE_TITLE
          $ISSUE_BODY"

      - name: Commit, push, open PR for human review
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="refactor/issue-$NUMBER"
          if git diff --quiet; then
            gh issue comment "$NUMBER" --body "CodeBuddy produced no changes."
            exit 1
          fi
          git add -A
          git commit -m "Refactor per issue #$NUMBER (CodeBuddy)"
          git push origin "$BRANCH"
          gh pr create \
            --title "CodeBuddy refactor for issue #$NUMBER" \
            --body "Generated by CodeBuddy CLI in GitHub Actions.

          Closes #$NUMBER

          Human review required before merge." \
            --base master \
            --head "$BRANCH"
