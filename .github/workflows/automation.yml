name: CodeBuddy Issue Automation

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: codebuddy-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Gate 1: ask a human to approve the new issue
  request-approval:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Ask human for approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" --body "CodeBuddy pipeline triggered by this issue. Human-in-the-loop approval required: reply with /approve on this issue to proceed."

  # After /approve: CodeBuddy CLI does the AI refactor, then opens a PR (gate 2: human merges)
  codebuddy-refactor:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.type == 'User' &&
      startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CodeBuddy CLI
        run: npm install -g @tencent-ai/codebuddy-code

      # Re-run hygiene: never clobber an open PR; clear stale branches from earlier runs
      - name: Prepare branch (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="codebuddy/issue-$NUMBER"
          OPEN_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q 'length')
          if [ "$OPEN_PRS" -gt 0 ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "An open PR already exists for branch \`$BRANCH\`. Merge or close it before re-running with /approve."
            echo "open_pr_exists=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git push origin --delete "$BRANCH" 2>/dev/null || true
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Run CodeBuddy refactor (headless)
        if: env.open_pr_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          CODEBUDDY_AUTH_TOKEN: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ioa
        run: |
          ISSUE_TITLE=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          ISSUE_BODY=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          codebuddy -p --max-turns 10 \
            --model glm-5.3 \
            --permission-mode auto \
            --no-session-persistence \
            "You are running headless in CI, in the repository working directory.
          Implement the following GitHub issue. Keep the change minimal.
          Replace the previous implementation entirely: remove files that the
          change supersedes, so the repo does not accumulate leftover files.
          Only modify files - do NOT run git commit or git push.
          Issue #$NUMBER: $ISSUE_TITLE
          $ISSUE_BODY"

      - name: Commit, push, open PR for human review
        if: env.open_pr_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          # Stage everything first so new (untracked) files count as changes too
          git add -A
          if git diff --cached --quiet; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "CodeBuddy produced no changes (the request appears already satisfied on master)."
            exit 0
          fi
          git commit -m "Refactor per issue #$NUMBER (CodeBuddy)"
          git push origin "$BRANCH"
          if ! PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "CodeBuddy refactor for issue #$NUMBER" \
              --body "Generated by CodeBuddy CLI in GitHub Actions.

          Closes #$NUMBER

          Human review required before merge." \
              --base master \
              --head "$BRANCH" 2>&1); then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Failed to open PR for branch \`$BRANCH\`: $PR_URL"
            exit 1
          fi
          echo "PR opened: $PR_URL"
