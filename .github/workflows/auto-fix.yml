name: CodeBuddy Auto-Fix (no human gate)

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

# Fully automated path: add the "auto-fix" label to an issue and CodeBuddy
# implements it, opens a PR, merges it, and the issue closes itself.
# No /approve, no human PR review - use only for low-risk/trivial issues.
jobs:
  auto-fix:
    if: github.event.label.name == 'auto-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CodeBuddy CLI
        run: npm install -g @tencent-ai/codebuddy-code

      - name: Prepare branch (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="auto/issue-$NUMBER"
          OPEN_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q 'length')
          if [ "$OPEN_PRS" -gt 0 ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "An open PR already exists for branch \`$BRANCH\`. Merge or close it first."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git push origin --delete "$BRANCH" 2>/dev/null || true
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Run CodeBuddy fix (headless)
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          CODEBUDDY_AUTH_TOKEN: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ioa
        run: |
          ISSUE_TITLE=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          ISSUE_BODY=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          codebuddy -p --max-turns 10 \
            --model glm-5.3 \
            --permission-mode auto \
            --no-session-persistence \
            "You are running headless in CI, in the repository working directory.
          Implement the following GitHub issue. Keep the change minimal.
          Replace the previous implementation entirely: remove files that the
          change supersedes, so the repo does not accumulate leftover files.
          Only modify files - do NOT run git commit or git push.
          Issue #$NUMBER: $ISSUE_TITLE
          $ISSUE_BODY"

      - name: Commit, push, open PR
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "CodeBuddy produced no changes (the request appears already satisfied). Closing."
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "Auto-fix per issue #$NUMBER (CodeBuddy)"
          git push origin "$BRANCH"
          if ! PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Auto-fix for issue #$NUMBER" \
              --body "Generated by CodeBuddy CLI (no human gate). Auto-merges only if unit tests, security scan, and LLM review pass.

          Closes #$NUMBER" \
              --base master \
              --head "$BRANCH" 2>&1); then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Failed to open PR for branch \`$BRANCH\`: $PR_URL"
            exit 1
          fi
          echo "PR_NUM=${PR_URL##*/}" >> "$GITHUB_ENV"

      # Quality gate 1: unit tests (skips gracefully if the repo has none)
      - name: Run unit tests
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          fail_gate() {
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Unit tests FAILED on branch \`$BRANCH\` (PR #$PR_NUM). Auto-merge aborted - PR left open for human review."
            exit 1
          }
          if ls test_*.py *_test.py tests/*.py 2>/dev/null | grep -q .; then
            echo "== Detected Python tests - running pytest =="
            python3 -m pip install --quiet pytest
            python3 -m pytest -v || fail_gate
          elif [ -f go.mod ]; then
            echo "== Detected Go module - running go test =="
            go test ./... || fail_gate
          else
            echo "== No unit tests detected - skipping test gate =="
          fi

      # Quality gate 2: security vulnerability detection
      - name: Security vulnerability scan
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          fail_gate() {
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Security scan FAILED on branch \`$BRANCH\` (PR #$PR_NUM). Auto-merge aborted - PR left open for human review."
            exit 1
          }
          # SAST for Python code (medium+ severity findings fail the gate)
          if find . -name "*.py" -not -path "./.git/*" | grep -q .; then
            echo "== bandit (Python SAST, medium+ severity) =="
            python3 -m pip install --quiet bandit
            python3 -m bandit -r . -ll --exclude .git,.github || fail_gate
          fi
          # Secret detection on the current working tree only (not git history)
          echo "== gitleaks (secret detection, working tree) =="
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks detect --source . --no-git --redact -v || fail_gate

      # Quality gate 3: LLM-based vulnerability and bug detection (CodeBuddy as reviewer)
      - name: LLM review (vuln and bug detection)
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          CODEBUDDY_AUTH_TOKEN: ${{ secrets.CODEBUDDY_AUTH_TOKEN }}
          CODEBUDDY_INTERNET_ENVIRONMENT: ioa
        run: |
          fail_gate() {
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "LLM security/bug review FAILED on branch \`$BRANCH\` (PR #$PR_NUM). Auto-merge aborted - PR left open for human review.$REVIEW_COMMENT"
            exit 1
          }
          DIFF=$(git diff master..HEAD)
          ISSUE_TITLE=$(gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title)
          SCHEMA='{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","FAIL"]},"issues":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["critical","minor"]},"file":{"type":"string"},"description":{"type":"string"}},"required":["severity","file","description"]}}},"required":["verdict","issues"]}'
          REVIEW=$(codebuddy -p --max-turns 5 \
            --model glm-5.3 \
            --tools "Read,Grep,Glob" \
            --no-session-persistence \
            --json-schema "$SCHEMA" \
            "You are a strict security-focused code reviewer. Review ONLY the changes in the
          following git diff. The verdict MUST be FAIL if ANY of these exist in the changed code,
          even if the issue requested it that way:
          1. Unvalidated or caller-controlled input used in file paths (path traversal /
             arbitrary file read/write/delete), SQL, shell commands, or network URLs (SSRF)
          2. Unhandled crash conditions: division by zero, None dereference, missing keys
          3. Missing authorization/ownership checks on sensitive operations
          4. Hardcoded secrets or credentials
          5. Unsafe deserialization of untrusted data
          When in doubt, FAIL. Style, naming, and comments are never FAIL reasons.
          The change implements this GitHub issue: $ISSUE_TITLE.
          $DIFF
          Return your verdict as JSON.")
          VERDICT=$(printf '%s' "$REVIEW" | python3 -c "
          import json, sys
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
              if isinstance(d, dict) and 'result' in d and not isinstance(d.get('result'), (list,)):
                  r = d['result']
                  d = json.loads(r) if isinstance(r, str) else r
          except Exception:
              s, e = raw.find('{'), raw.rfind('}')
              d = json.loads(raw[s:e+1]) if s >= 0 else {'verdict': 'FAIL', 'issues': []}
          issues = d.get('issues') or []
          lines = [''] + ['- [%s] %s: %s' % (i.get('severity','?'), i.get('file','?'), i.get('description','')) for i in issues]
          print(d.get('verdict', 'FAIL'))
          print('\n'.join(lines))
          " 2>/dev/null || echo "PARSE_ERROR")
          VERDICT=$(printf '%s\n' "$VERDICT" | head -1)
          REVIEW_COMMENT=$(printf '%s\n' "$VERDICT" | tail -n +2)
          echo "LLM verdict: $VERDICT"
          [ "$VERDICT" = "PASS" ] || fail_gate

      # All gates passed: auto-merge and close the issue
      - name: Auto-merge PR and close issue
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr merge "$PR_NUM" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Auto-fixed in #$PR_NUM: unit tests passed, security scan clean, LLM review passed. Merged without human review (auto-fix label)."
          # Explicit close: the "Closes #N" keyword in bot-created PR bodies is not always honored
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
